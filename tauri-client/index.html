<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IronClaw Desktop</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="app-shell">
      <header class="top-nav">
        <div class="brand">
          <strong>IronClaw Desktop</strong>
          <span class="sub">v0.1.0</span>
        </div>
        <nav class="tabs" role="tablist" aria-label="Main navigation">
          <button class="top-tab active" role="tab" aria-selected="true" data-tab="workspace">
            工作台
          </button>
          <button class="top-tab" role="tab" aria-selected="false" data-tab="employees">
            数字员工
          </button>
          <button class="top-tab" role="tab" aria-selected="false" data-tab="console">
            控制台
          </button>
        </nav>
      </header>

      <section id="panel-workspace" class="tab-panel active" role="tabpanel">
        <h1>工作台</h1>
        <div class="workspace-tools card">
          <div class="workspace-tools-row">
            <div class="runtime-title">
              <strong>IronClaw 运行时</strong>
              <span id="runtime-status-pill">未运行</span>
            </div>
            <div class="workspace-actions">
              <button id="start-ironclaw-btn" type="button">运行</button>
              <button id="stop-ironclaw-btn" type="button">停止</button>
              <button id="detect-ironclaw-btn" type="button">检测</button>
              <button id="open-console-link-btn" type="button">打开控制台</button>
            </div>
          </div>
          <div class="gateway-token-row">
            <input id="gateway-token-input" type="password" placeholder="输入 GATEWAY_AUTH_TOKEN" data-config-key="gatewayToken" />
            <button id="apply-gateway-token-btn" type="button">应用 Token</button>
          </div>
          <p id="ironclaw-runtime-result">检测中...</p>
        </div>

        <div class="subtabs" role="tablist" aria-label="Workspace sections">
          <button class="subtab active" role="tab" aria-selected="true" data-subtab="models">模型</button>
          <button class="subtab" role="tab" aria-selected="false" data-subtab="channels">通道</button>
          <button class="subtab" role="tab" aria-selected="false" data-subtab="tools">工具</button>
        </div>

        <div id="subpanel-models" class="subpanel active" role="tabpanel">
          <article class="card">
            <h2>模型配置</h2>
            <form class="form-grid">
              <label>
                协议类型
                <select data-config-key="modelProtocol">
                  <option>openai-completions</option>
                  <option>anthropic-messages</option>
                </select>
              </label>
              <label>
                Provider ID
                <input placeholder="例如：proxy" data-config-key="modelProviderId" />
              </label>
              <label>
                Base URL
                <input placeholder="https://your-endpoint/v1" data-config-key="modelBaseUrl" />
              </label>
              <label>
                API Key
                <input type="password" placeholder="输入 API Key" data-config-key="modelApiKey" />
              </label>
              <label>
                模型 ID
                <input placeholder="例如：deepseek-chat" data-config-key="modelId" />
              </label>
              <label>
                默认模型引用
                <input placeholder="自动生成：provider/model" data-config-key="modelDefaultRef" />
              </label>
            </form>
          </article>
        </div>

        <div id="subpanel-channels" class="subpanel" role="tabpanel">
          <article class="card">
            <h2>通道管理</h2>
            <form class="form-grid">
              <label>
                通道类型
                <select data-config-key="channelType">
                  <option>Feishu</option>
                  <option>Telegram</option>
                  <option>Slack</option>
                </select>
              </label>
              <label>
                通道来源 URL
                <input placeholder="WASM/registry 地址" data-config-key="channelSourceUrl" />
              </label>
              <label>
                App ID / Token
                <input placeholder="输入通道鉴权字段" data-config-key="channelAppIdOrToken" />
              </label>
              <label>
                App Secret
                <input type="password" placeholder="输入通道密钥" data-config-key="channelAppSecret" />
              </label>
            </form>
          </article>
        </div>

        <div id="subpanel-tools" class="subpanel" role="tabpanel">
          <article class="card">
            <h2>工具管理</h2>
            <form class="form-grid">
              <label>
                工具名称
                <input placeholder="例如：github" data-config-key="toolName" />
              </label>
              <label>
                安装来源
                <input placeholder="registry / URL / 本地目录" data-config-key="toolInstallSource" />
              </label>
              <label>
                执行命令
                <input placeholder="工具入口命令" data-config-key="toolCommand" />
              </label>
              <label>
                环境变量
                <input placeholder="KEY=VALUE" data-config-key="toolEnv" />
              </label>
            </form>
          </article>
        </div>
      </section>

      <section id="panel-employees" class="tab-panel" role="tabpanel">
        <h1>数字员工</h1>
        <div class="card">
          <p>从远程目录搜索岗位并一键安装 skills / tools / MCP。</p>
        </div>
      </section>

      <section id="panel-console" class="tab-panel" role="tabpanel">
        <h1>控制台</h1>
        <div class="card">
          <div class="console-toolbar">
            <button id="open-console-window-btn" type="button">应用内窗口打开</button>
            <button id="open-console-link-panel-btn" type="button">浏览器打开</button>
          </div>
          <p>切换到该页会自动在应用内窗口打开控制台，若未弹出可手动点击“应用内窗口打开”。</p>
        </div>
      </section>
    </main>
  </body>
</html>
